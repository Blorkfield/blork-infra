name: CI

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      run_typecheck:
        description: 'Whether to run typecheck'
        type: boolean
        default: true
      typecheck_command:
        description: 'Command to run for typecheck'
        type: string
        default: 'pnpm typecheck'
      enable_automerge:
        description: 'Enable auto-merge for PRs'
        type: boolean
        default: true

jobs:
  build:
    name: Build and Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        if: inputs.run_typecheck
        run: ${{ inputs.typecheck_command }}

  automerge:
    name: Auto-merge
    needs: build
    runs-on: ubuntu-latest
    if: inputs.enable_automerge && github.event_name == 'pull_request'
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
