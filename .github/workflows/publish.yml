name: Publish

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      publish_npm:
        description: 'Whether to publish to npm'
        type: boolean
        default: false
      npm_access:
        description: 'npm access level (public or restricted)'
        type: string
        default: 'public'
      publish_docker:
        description: 'Whether to publish Docker image'
        type: boolean
        default: false
      docker_image_name:
        description: 'Docker image name (without registry prefix)'
        type: string
        default: ''
      docker_registry:
        description: 'Docker registry to push to'
        type: string
        default: 'ghcr.io'
      docker_context:
        description: 'Docker build context path'
        type: string
        default: '.'
      force_publish:
        description: 'Force publish regardless of release merge detection'
        type: boolean
        default: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      is_release_merge: ${{ steps.check.outputs.is_release_merge }}
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release status
        id: check
        run: |
          # Check if this commit is a release merge
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -q "^chore(release):"; then
            echo "is_release_merge=true" >> $GITHUB_OUTPUT
          else
            echo "is_release_merge=false" >> $GITHUB_OUTPUT
          fi

          # Check if there are changesets (excluding README.md)
          CHANGESET_COUNT=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)
          if [ "$CHANGESET_COUNT" -gt 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

  create-release-pr:
    needs: check-release
    runs-on: ubuntu-latest
    if: needs.check-release.outputs.has_changesets == 'true' && needs.check-release.outputs.is_release_merge == 'false'
    steps:
      - name: Create bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "bork-blot[bot]"
          git config user.email "bork-blot[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release branch and PR
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          BRANCH_NAME="release/version-packages"

          # Delete existing branch if it exists
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

          # Create and checkout release branch
          git checkout -b "$BRANCH_NAME"

          # Run changeset version to consume changesets and update versions
          pnpm changeset version

          # Commit changes
          git add -A
          git commit -m "chore(release): version packages"

          # Push branch
          git push origin "$BRANCH_NAME"

          # Create PR
          gh pr create \
            --title "chore(release): version packages" \
            --body "This PR was auto-generated to version packages based on changesets." \
            --base main \
            --head "$BRANCH_NAME"

  publish-npm:
    needs: check-release
    runs-on: ubuntu-latest
    if: inputs.publish_npm && (needs.check-release.outputs.is_release_merge == 'true' || inputs.force_publish)
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for provenance support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access ${{ inputs.npm_access }} --provenance
          echo "published=true" >> $GITHUB_OUTPUT

  publish-docker:
    needs: [check-release, publish-npm]
    runs-on: ubuntu-latest
    # Run if docker is enabled AND (this is a release merge OR force publish)
    # If npm is enabled, wait for it; if npm is disabled, publish-npm is skipped so this still runs
    if: |
      always() &&
      inputs.publish_docker &&
      (needs.check-release.outputs.is_release_merge == 'true' || inputs.force_publish) &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.docker_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          push: true
          tags: |
            ${{ inputs.docker_registry }}/${{ github.repository_owner }}/${{ inputs.docker_image_name }}:${{ steps.version.outputs.version }}
            ${{ inputs.docker_registry }}/${{ github.repository_owner }}/${{ inputs.docker_image_name }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
