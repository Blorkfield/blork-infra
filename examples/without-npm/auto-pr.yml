# Example Auto PR workflow for repos that DON'T publish to npm
# Copy this to your repo's .github/workflows/auto-pr.yml

name: Auto PR

on:
  push:
    branches-ignore:
      - main
      - 'release/**'

jobs:
  auto-pr:
    uses: Blorkfield/blork-infra/.github/workflows/auto-pr.yml@main
    secrets: inherit
    with:
      package_name: '@blorkfield/obs-overlay'  # Change this
      # watched_paths uses sensible default, only override if needed
