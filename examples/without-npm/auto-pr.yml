# Example Auto PR workflow for repos that DON'T publish to npm (like obs-overlay)
# Copy this to your repo's .github/workflows/auto-pr.yml

name: Auto PR

on:
  push:
    branches-ignore:
      - main
      - 'release/**'

jobs:
  auto-pr:
    uses: Blorkfield/blork-infra/.github/workflows/auto-pr.yml@main
    secrets: inherit
    with:
      package_name: '@blorkfield/obs-overlay'
      watched_paths: '^(src/|package\.json|tsconfig\.json|vite\.config\.ts|Dockerfile|nginx\.conf)'
